output: results/qwen_40k_80k.jsonl
device: cuda
dtype: bfloat16
attn: sdpa
seed: 0
repeats: 2
warmup_steps: 5
measure_steps: 250
memory_fraction: 0.9
cooldown_s: 1
models: ["${QWEN}"]
grids:
  - n_ctx: [40960]
    batch: [1]
    prefill_chunk: [8192]
    kv: &plans
      - {kind: full}
      - {kind: full, offload: 0.5}
      - {kind: full, offload: 1.0}
      - {kind: full, offload: 0.5, prefetch: false}
      - {kind: int8}
      - {kind: int8, offload: 0.5}
      - {kind: int8, offload: 1.0}
      - {kind: int8, offload: 0.5, prefetch: false}
  - n_ctx: [40960]
    batch: [3]
    prefill_chunk: [8192]
    kv: *plans
  - n_ctx: [81920]
    batch: [1]
    prefill_chunk: [8192]
    kv: *plans
  - n_ctx: [40960]
    batch: [1]
    prefill_chunk: [2048]
    kv:
      - {kind: full}
      - {kind: int8}
